server:
  port: 9010
spring:
  application:
    name: "inventory"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3310/inventorydb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always 
  config:
    import: "optional:configserver:http://configserver:8071/"
  # rabbitmq: 
  #   host: "rabbitmq"
  #   port:  5672
  #   username: "guest"
  #   password: "guest"

management:
  endpoints: 
    web:
      exposure: 
        include: "*"