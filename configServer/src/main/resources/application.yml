spring: 
  application: 
    name: "configserver"
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/BernardKing08/DLMS"
          default-label: addingUI
          timeout: 5
          clone-on-start: true
          force-pull: true
          search-paths: "configServer/src/main/resources/config"
  # rabbitmq:
  #   host: "rabbitmq"
  #   port: 5672
  #   username: "guest"
  #   password: "guest"
    
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health: 
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      
server: 
  port: 8071