spring: 
  application: 
    name: "configserver"
  profiles:
    active: git               # ← changed
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/BernardKing08/DLMS"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
          search-paths: "config"   # ← add if configs are in a subfolder
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"
    
management:
  endpoints:
    web:
      exposure:
        include: "*"
      
server: 
  port: 8071