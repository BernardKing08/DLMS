<!DOCTYPE html>
<html lang="zxx">
    

<head>        
        
        <!-- Meta -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1">
        
        <!-- Title -->
        <title>..:: LIBRARIA ::..</title>
        
        <!-- Favicon -->
        <link th:href="@{/images/favicon.ico}" rel="icon" type="image/x-icon" />
        
        <!-- Fonts -->
        <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i,800,800i%7CLato:100,100i,300,300i,400,400i,700,700i,900,900i" rel="stylesheet" />
        <link th:href="@{/css/font-awesome.min.css}" rel="stylesheet" type="text/css" />
        
        <!-- Mobile Menu -->
        <link th:href="@{/css/mmenu.css}" rel="stylesheet" type="text/css" />
        <link th:href="@{/css/mmenu.positioning.css}" rel="stylesheet" type="text/css" />
        
        <!-- Stylesheet -->
        <link th:href="@{/css/style.css}" rel="stylesheet" type="text/css" />
        
        <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
        <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
        <!--[if lt IE 9]>
        <script th:src="@{/js/html5shiv.min.js}"></script>
        <script th:src="@{/js/respond.min.js}"></script>
        <![endif]-->
    </head>


    <body>
        
        <!-- Start: Header Section -->
        <header id="header-v1" th:replace="~{fragments/header :: siteHeader('', true)}"></header>
        <!-- End: Header Section -->
        
        <!-- Start: Page Banner -->
        <section class="page-banner services-banner">
            <div class="container">
                <div class="banner-header">
                    <h2>Signin</h2>
                    <span class="underline center"></span>
                    <p class="lead">Proin ac eros pellentesque dolor pharetra tempo.</p>
                </div>
                <div class="breadcrumb">
                    <ul>
                        <li><a th:href="@{/}">Home</a></li>
                        <li>Signin</li>
                    </ul>
                </div>
            </div>
        </section>
        <!-- End: Page Banner -->
        <!-- Start: Cart Section -->
        <div id="content" class="site-content">
            <div id="primary" class="content-area">
                <main id="main" class="site-main">
                    <div class="signin-main">
                        <div class="container">
                            <div class="woocommerce">
                                <div class="woocommerce-login">
                                    <div class="company-info signin-register">
                                        <div class="col-md-5 col-md-offset-1 border-dark-left">
                                            <div class="row">
                                                <div class="col-md-12">
                                                    <div class="company-detail bg-dark margin-left">
                                                        <div class="signin-head">
                                                            <h2>Sign in</h2>
                                                            <span class="underline left"></span>
                                                        </div>
                                                        <p th:if="${loginError}" th:text="${loginError}" style="color:#c0392b;"></p>
                                                        <form class="login" method="post" th:action="@{/signin/login}" th:object="${loginForm}">
                                                            <p class="form-row form-row-first input-required">
                                                                <label>
                                                                    <span class="first-letter">Email</span>
                                                                    <span class="second-letter">*</span>
                                                                </label>
                                                                <input type="email" id="email" th:field="*{email}" class="input-text">
                                                                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:#c0392b;"></span>
                                                             </p>
                                                            <p class="form-row form-row-last input-required">
                                                                <label>
                                                                    <span class="first-letter">Password</span>
                                                                    <span class="second-letter">*</span>
                                                                </label>
                                                                <input type="password" id="password" th:field="*{password}" class="input-text">
                                                                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:#c0392b;"></span>
                                                            </p>
                                                            <div class="clear"></div>
                                                            <input type="submit" value="Login" name="login" class="button btn btn-default">
                                                            <div class="clear"></div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-5 border-dark new-user">
                                            <div class="row">
                                                <div class="col-md-12">
                                                    <div class="company-detail new-account bg-light margin-right">
                                                        <div class="new-user-head">
                                                            <h2>Create New Account</h2>
                                                            <span class="underline left"></span>
                                                            <p>Register for a library account.</p>
                                                        </div>
                                                        <p th:if="${registerSuccess}" th:text="${registerSuccess}" style="color:#2e7d32;"></p>
                                                        <p th:if="${registerError}" th:text="${registerError}" style="color:#c0392b;"></p>
                                                        <form class="login" method="post" th:action="@{/signin/register}" th:object="${registerForm}">
                                                            <p class="form-row form-row-first input-required">
                                                                <label>
                                                                    <span class="first-letter">Full Name</span>
                                                                    <span class="second-letter">*</span>
                                                                </label>
                                                                <input type="text" id="name" th:field="*{name}" class="input-text">
                                                                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:#c0392b;"></span>
                                                            </p>
                                                            <p class="form-row input-required">
                                                                <label>
                                                                    <span class="first-letter">Email</span>
                                                                    <span class="second-letter">*</span>
                                                                </label>
                                                                <input type="email" id="email1" th:field="*{email}" class="input-text">
                                                                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:#c0392b;"></span>
                                                            </p>
                                                            <p class="form-row input-required">
                                                                <label>
                                                                    <span class="first-letter">Password</span>
                                                                    <span class="second-letter">*</span>
                                                                </label>
                                                                <input type="password" id="password1" th:field="*{password}" class="input-text">
                                                                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:#c0392b;"></span>
                                                            </p>
                                                            <p class="form-row input-required">
                                                                <label>
                                                                    <span class="first-letter">Confirm Password</span>
                                                                    <span class="second-letter">*</span>
                                                                </label>
                                                                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="input-text">
                                                                <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color:#c0392b;"></span>
                                                            </p>
                                                            <div class="clear"></div>
                                                            <input type="submit" value="Signup" name="signup" class="button btn btn-default">
                                                            <div class="clear"></div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <!-- End: Cart Section -->
        
        <!-- Start: Social Network -->
        <section class="social-network section-padding">
            <div class="container">
                <div class="center-content">
                    <h2 class="section-title">Follow Us</h2>
                    <span class="underline center"></span>
                    <p class="lead">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                </div>
                <ul>
                    <li>
                        <a class="facebook" href="#" target="_blank">
                            <span>
                                <i class="fa fa-facebook-f"></i>
                            </span>
                        </a>
                    </li>
                    <li>
                        <a class="twitter" href="#" target="_blank">
                            <span>
                                <i class="fa fa-twitter"></i>
                            </span>
                        </a>
                    </li>
                    <li>
                        <a class="google" href="#" target="_blank">
                            <span>
                                <i class="fa fa-google-plus"></i>
                            </span>
                        </a>
                    </li>
                    <li>
                        <a class="rss" href="#" target="_blank">
                            <span>
                                <i class="fa fa-rss"></i>
                            </span>
                        </a>
                    </li>
                    <li>
                        <a class="linkedin" href="#" target="_blank">
                            <span>
                                <i class="fa fa-linkedin"></i>
                            </span>
                        </a>
                    </li>
                    <li>
                        <a class="youtube" href="#" target="_blank">
                            <span>
                                <i class="fa fa-youtube"></i>
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </section>
        <!-- End: Social Network -->
        
        <!-- Start: Footer -->
        <footer class="site-footer" th:replace="~{fragments/footer :: siteFooter}"></footer>
        <!-- End: Footer -->
        
        <!-- jQuery Latest Version 1.x -->
        <script type="text/javascript" th:src="@{/js/jquery-1.12.4.min.js}"></script>
        
        <!-- jQuery UI -->
        <script type="text/javascript" th:src="@{/js/jquery-ui.min.js}"></script>
        
        <!-- jQuery Easing -->
        <script type="text/javascript" th:src="@{/js/jquery.easing.1.3.js}"></script>

        <!-- Bootstrap -->
        <script type="text/javascript" th:src="@{/js/bootstrap.min.js}"></script>
        
        <!-- Mobile Menu -->
        <script type="text/javascript" th:src="@{/js/mmenu.min.js}"></script>
        
        <!-- Harvey - State manager for media queries -->
        <script type="text/javascript" th:src="@{/js/harvey.min.js}"></script>
        
        <!-- Waypoints - Load Elements on View -->
        <script type="text/javascript" th:src="@{/js/waypoints.min.js}"></script>

        <!-- Facts Counter -->
        <script type="text/javascript" th:src="@{/js/facts.counter.min.js}"></script>

        <!-- MixItUp - Category Filter -->
        <script type="text/javascript" th:src="@{/js/mixitup.min.js}"></script>

        <!-- Owl Carousel -->
        <script type="text/javascript" th:src="@{/js/owl.carousel.min.js}"></script>
        
        <!-- Accordion -->
        <script type="text/javascript" th:src="@{/js/accordion.min.js}"></script>
        
        <!-- Responsive Tabs -->
        <script type="text/javascript" th:src="@{/js/responsive.tabs.min.js}"></script>
        
        <!-- Responsive Table -->
        <script type="text/javascript" th:src="@{/js/responsive.table.min.js}"></script>
        
        <!-- Masonry -->
        <script type="text/javascript" th:src="@{/js/masonry.min.js}"></script>
        
        <!-- Carousel Swipe -->
        <script type="text/javascript" th:src="@{/js/carousel.swipe.min.js}"></script>
        
        <!-- bxSlider -->
        <script type="text/javascript" th:src="@{/js/bxslider.min.js}"></script>
        
        <!-- Custom Scripts -->
        <script type="text/javascript" th:src="@{/js/main.js}"></script>

    </body>


</html>
