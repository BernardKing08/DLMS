server:
  port: 8090
spring:
  application:
    name: "authentication"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3308/authdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always 
  config:
    import: "optional:configserver:http://configserver:8071/"
  # rabbitmq:
  #   host: "rabbitmq"
  #   port:  5672
  #   username: "guest"
  #   password: "guest"

services:
  account:
    url: http://account

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
  info:
    env:
      enabled: true

eureka:
  instance:
    preferIpAddress: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  
info:
  app:
    name: "Authentication"
    description: "DLMS - Authentication Service"
    version: "1.0.0"
  