server:
  port: 8090
spring:
  application:
    name: "authentication"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3308/authdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always 
  config:
    import: "optional:configserver:http://configserver:8071/"
  # rabbitmq:
  #   host: "rabbitmq"
  #   port:  5672
  #   username: "guest"
  #   password: "guest"

services:
  account:
    url: http://account:8080

management:
  endpoints: 
    web:
      exposure: 
        include: "*"
  