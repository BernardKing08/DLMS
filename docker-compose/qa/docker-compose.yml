# docker-compose.yml
# QA stack: same services as default, but each microservice runs on the
# "qa" Spring profile, which points it at an in-memory H2 database instead
# of MySQL (see application-qa.yml in each service). No MySQL containers
# needed here at all - only the config server + the four app services.

services:

  configserver:
    image: bernardking08/config-server:cc1
    container_name: configserver
    ports:
      - "8071:8071"
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  accounts:
    image: bernardking08/accounts-service:cc1
    container_name: account
    ports:
      - "8080:8080"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "accounts"

  auth:
    image: bernardking08/auth-service:cc1
    container_name: auth
    ports:
      - "8090:8090"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "authentication"

  catalog:
    image: bernardking08/catalog-service:cc1
    container_name: catalog
    ports:
      - "9000:9000"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "catalog"

  inventory:
    image: bernardking08/inventory-service:cc1
    container_name: inventory
    ports:
      - "9010:9010"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "inventory"

networks:
  bernardking08:
    driver: "bridge"
