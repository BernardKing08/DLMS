services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s   
    networks:
      - bernardking08
  configserver: 
    image: bernardking08/config-service:s6
    container_name: configserver
    ports:
      - "8071:8071"
    depends_on: 
      rabbitmq:
        condition: service_healthy  
    healthcheck: 
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - bernardking08

  accounts: 
    image: bernardking08/accounts-service:s6
    container_name: account
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - bernardking08
    environment:
      SPRING_APPLICATION_NAME: "accounts"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071"
      SPRING_PROFILES_ACTIVE: default
      
  auth: 
    image: bernardking08/auth-service:s6
    container_name: auth
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - bernardking08
    environment:
      SPRING_APPLICATION_NAME: "authentication"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071"
      SPRING_PROFILES_ACTIVE: default

  catalog: 
    image: bernardking08/catalog-service:s6
    container_name: catalog
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - bernardking08
    environment:
      SPRING_APPLICATION_NAME: "catalog"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071"
      SPRING_PROFILES_ACTIVE: default

  inventory: 
    image: bernardking08/inventory-service:s6
    container_name: inventory
    ports:
      - "9010:9010"
    depends_on:
      configserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - bernardking08
    environment:
      SPRING_APPLICATION_NAME: "inventory"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071"
      SPRING_PROFILES_ACTIVE: default

networks:
  bernardking08: 
    driver: "bridge"