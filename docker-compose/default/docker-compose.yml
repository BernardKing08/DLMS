# docker-compose.yml
# The real stack. Each service inherits shared config from common-config.yml
# via `extends`, and declares only what is unique to it (image, ports, name,
# app name) plus its own depends_on (which is intentionally NOT inherited).

services:
  accountsdb:
    container_name: accountsdb
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: "accountsdb"
    extends:
      file: common-config.yml
      service: microservice-db-config

  authdb:
    container_name: authdb
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: "authdb"
    extends:
      file: common-config.yml
      service: microservice-db-config

  catalogdb:
    container_name: catalogdb
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: "catalogdb"
    extends:
      file: common-config.yml
      service: microservice-db-config

  inventorydb:
    container_name: inventorydb
    ports:
      - "3310:3306"
    environment:
      MYSQL_DATABASE: "inventorydb"
    extends:
      file: common-config.yml
      service: microservice-db-config

  configserver:
    image: bernardking08/config-server:cc2
    container_name: configserver
    ports:
      - "8071:8071"
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  eurekaserver:
    image: bernardking08/eureka-server:cc2
    container_name: eurekaserver
    ports:
      - "8761:8761"
    healthcheck:
      test: "curl --fail --silent localhost:8761/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config
    environment:
      SPRING_APPLICATION_NAME: "eureka-server"

  accounts:
    image: bernardking08/accounts-service:cc2
    container_name: account
    ports:
      - "8080:8080"
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    depends_on:
      accountsdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "account"
      SPRING_DATASOURCE_URL: "jdbc:mysql://accountsdb:3306/accountsdb"

  accounts1:
    image: bernardking08/accounts-service:cc2
    container_name: account1
    ports:
      - "8081:8080"
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    depends_on:
      accountsdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "account"
      SPRING_DATASOURCE_URL: "jdbc:mysql://accountsdb:3306/accountsdb"

  auth:
    image: bernardking08/auth-service:cc2
    container_name: auth
    ports:
      - "8090:8090"
    healthcheck:
      test: "curl --fail --silent localhost:8090/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    depends_on:
      authdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "authentication"
      SPRING_DATASOURCE_URL: "jdbc:mysql://authdb:3306/authdb"

  auth1:
    image: bernardking08/auth-service:cc2
    container_name: auth1
    ports:
      - "8091:8090"
    healthcheck:
      test: "curl --fail --silent localhost:8091/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    depends_on:
      authdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "authentication"
      SPRING_DATASOURCE_URL: "jdbc:mysql://authdb:3306/authdb"

  catalog:
    image: bernardking08/catalog-service:cc2
    container_name: catalog
    ports:
      - "9000:9000"
    healthcheck:
      test: "curl --fail --silent localhost:9000/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    depends_on:
      catalogdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "catalog"
      SPRING_DATASOURCE_URL: "jdbc:mysql://catalogdb:3306/catalogdb"

  inventory:
    image: bernardking08/inventory-service:cc2
    container_name: inventory
    ports:
      - "9010:9010"
    healthcheck:
      test: "curl --fail --silent localhost:9010/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    depends_on:
      inventorydb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "inventory"
      SPRING_DATASOURCE_URL: "jdbc:mysql://inventorydb:3306/inventorydb"

  frontend:
    image: bernardking08/frontend-service:cc2
    container_name: frontend
    ports:
      - "8073:8073"
    healthcheck:
      test: "curl --fail --silent localhost:8073/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    depends_on:
      accounts:
        condition: service_healthy
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      inventory:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "frontend"

  gatewayserver:
    image: bernardking08/gatewayserver:cc2
    container_name: gatewayserver
    ports:
      - "8072:8072"
    healthcheck:
      test: "curl --fail --silent localhost:8072/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    depends_on:
      accounts:
        condition: service_healthy
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      inventory:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "gatewayserver"

networks:
  bernardking08:
    driver: "bridge"