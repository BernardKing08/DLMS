server:
  port: 8080
spring:
  application:
    name: "account"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://host.docker.internal:3307/accountdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always 
  config:
    import: "optional:configserver:http://configserver:8071/"
  # rabbitmq:
  #   host: "rabbitmq"
  #   port:  5672
  #   username: "guest"
  #   password: "guest"

services:
  auth:
    url: http://auth:8090

management:
  endpoints: 
    web:
      exposure: 
        include: "*"
  